  <text x="48" y="378" fill="#F1707B" font-size="12">↑ 빨간 배지 클릭 → GitHub가 열려 직접 확인·설치 (git pull → install.cmd)</text>

  <!-- menu -->
  <text x="48" y="410" fill="#8a8aa0" font-size="12" font-weight="700">▾ 또는 우클릭 메뉴 (보기 모드 + Language)</text>
