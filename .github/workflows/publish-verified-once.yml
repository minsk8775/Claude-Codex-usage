name: Publish verified v0.9.2 once
on:
  push:
    branches: [release/verified-v0.9.2-20261028]
permissions:
  contents: read
jobs:
  release:
    if: github.repository == 'minsk8775/Claude-Codex-usage' && github.ref == 'refs/heads/release/verified-v0.9.2-20261028'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: e8cc65e6133d4756c067b51b311f9ea7c40c2a29
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Recheck offline tests and version
        shell: pwsh
        run: |
          if (-not (Select-String -LiteralPath claude_usage.pyw -SimpleMatch 'APP_VERSION = "0.9.2"' -Quiet)) { throw 'Version mismatch' }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Publish exact tested commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'minsk8775/Claude-Codex-usage'
          $sha = 'e8cc65e6133d4756c067b51b311f9ea7c40c2a29'
          $tag = 'v0.9.2'
          $main = gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0 -or $main -ne $sha) { throw 'Main changed or cannot be verified' }
          $existingTag = gh api "repos/$repo/tags" --paginate --jq '.[] | select(.name == "v0.9.2") | .commit.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect tags' }
          if ($existingTag -and $existingTag -ne $sha) { throw 'Tag points to another commit' }
          $existingRelease = gh api "repos/$repo/releases" --paginate --jq '.[] | select(.tag_name == "v0.9.2") | .html_url'
          if ($LASTEXITCODE -ne 0 -or $existingRelease) { throw 'Release already exists or cannot be verified; inspect before retrying' }
          if (-not $existingTag) {
            gh api "repos/$repo/git/refs" -f "ref=refs/tags/$tag" -f "sha=$sha" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Tag creation failed; inspect before retrying' }
          }
          $verifiedTag = gh api "repos/$repo/commits/$tag" --jq '.sha'
          if ($LASTEXITCODE -ne 0 -or $verifiedTag -ne $sha) { throw 'Tag verification failed before publication' }
          @'
          Settings now use the existing atomic JSON writer, preserving the previous complete file if replacement fails. SECURITY.md matches the actual show/autoshow/exit UDP commands. GitHub Actions are pinned to verified commit SHAs.

          Validation: all 44 offline Windows tests passed. No new dependencies. Source archives follow the existing release policy.

          Back up existing source and settings before updating, and preserve startup mode and browser profiles. Do not uninstall an existing installation to apply this patch.
          '@ | Set-Content -LiteralPath release-notes.txt -Encoding utf8
          gh release create $tag --repo $repo --verify-tag --title $tag --notes-file release-notes.txt
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed; inspect release state before retrying' }
          $published = gh api "repos/$repo/commits/$tag" --jq '.sha'
          if ($LASTEXITCODE -ne 0 -or $published -ne $sha) { throw 'Published tag verification failed' }
